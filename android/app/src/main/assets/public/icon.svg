<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E241B" />
      <stop offset="100%" stop-color="#121711" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5C68A" />
      <stop offset="60%" stop-color="#87A96B" />
      <stop offset="100%" stop-color="#4A6B35" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#87A96B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#33402E" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Botanical Sprout & Shield Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Shield Outline -->
    <path d="M 0 -150 Q 120 -150 140 -40 C 140 80 80 150 0 180 C -80 150 -140 80 -140 -40 Q -120 -150 0 -150 Z" 
          fill="#1E241B" stroke="url(#sageGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Central Sprout / Life Energy -->
    <!-- Left Leaf -->
    <path d="M 0 50 C -60 20 -80 -40 -30 -90 C -10 -50 0 -10 0 50 Z" 
          fill="url(#sageGrad)" />
    <!-- Right Leaf -->
    <path d="M 0 50 C 60 20 80 -40 30 -90 C 10 -50 0 -10 0 50 Z" 
          fill="url(#sageGrad)" fill-opacity="0.9" />
    <!-- Center Stem & Core Gem -->
    <path d="M 0 60 L 0 -110" stroke="#F4F7F2" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-115" r="14" fill="#F4F7F2"/>
  </g>
</svg>
